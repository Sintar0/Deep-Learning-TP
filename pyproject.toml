[project]
name = "tps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm7.14"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "rocm" }
torchvision = { index = "rocm" }
numpy = { index = "pypi" }
matplotlib = { index = "pypi" }
ipykernel = { index = "pypi" }
